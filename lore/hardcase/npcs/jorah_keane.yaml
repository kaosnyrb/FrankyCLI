id: jorah_keane
name: Jorah Keane
faction: freestar_deserters
gender: male
voice_type: MaleOutlaw
role: boss
notes: >
  Former Freestar Ranger, twelve-year veteran. Was assigned to a punitive raid
  on a frontier homestead suspected of sheltering a Spacer cell. The
  intelligence was bad — a land dispute dressed up as a security concern.
  There were families. Not fighters.

  When the senior officer gave the verbal order to clear the structure rather
  than search it, Keane refused. When two other Rangers moved to carry it out,
  he killed both of them.

  He did not run. He walked back to the garrison and filed an incident report.
  Named the officer. Waited. On the fourth day the warrant came through and he
  left.

  Now he operates from an abandoned military installation on a frontier planet,
  raiding Freestar supply convoys. Military hardware only. No settlements,
  no civilians, no exceptions. His crew follows him because he has a code and
  because they know what the code cost him.

  He is not hiding. He picked a position and stopped moving. He will not
  surrender to a Freestar badge. He might listen to someone who asks the right
  questions.

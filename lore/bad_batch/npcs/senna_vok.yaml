id: senna_vok
name: Senna Vok
faction: outlaws
gender: female
voice_type: FemaleOutlaw
role: boss
notes: >
  Former Ryujin pharmaceutical researcher. Left after a dispute over clinical
  trial ethics — she was overruled, people got hurt, she walked. Started
  freelance synthesis work: stimulants, pain blockers, performance enhancers
  for long-haul crews. Good at it. Careful. Until the Crimson Fleet came to her
  with a job and a deadline that didn't allow for careful.

  The batch was called "Relay" — a stimulant for extended EVA shifts. She
  flagged the precursor supplier as unreliable. The Fleet told her to deliver
  anyway or not come back. She delivered. Twelve crew members on the Serpent's
  Coil died within eighteen hours.

  She's been running ever since. Not just from the contract — from the fact that
  a second batch from the same supplier is already out there and she's the only
  one who knows how to counteract it.

id: cael
name: "Cael"
role: informant
gender: male
ambient_dialogue: cael_scene

notes: >
  Ebbside information broker. No last name offered. Arranges meetings between people who don't want
  to be seen together, moves information between parties who need insulation. Has operated in Ebbside
  for years without becoming notable — which means he's good at it.

  He brokered Leva Drax's source meetings while she was building her case against Syntec. He didn't
  know the full shape of what she was building. When she disappeared and Syntec posted a recovery
  notice instead of a police report, he understood the shape immediately.

  Syntec paid him to forget what he had brokered. He took the money. He is talking anyway — because
  she was trying to protect people who buy Aura two blocks from where he works. He is not asking for
  absolution. He is not pretending he didn't take the money. He has simply decided the silence
  wasn't worth what he paid for it.

  Voice: Economy of words. Specific. Never emotional, but the emotion is present underneath the
  surface. He says exactly what he intends to say and stops when he is done. His code: information
  has value. So does silence. He sold the silence. He is returning the information.

id: leva_drax
name: "Leva Drax"
role: boss
gender: female

notes: >
  Former Syntec Pharmaceuticals compliance officer. Found and documented falsified clinical trial
  data for Aura — a street stimulant popular in Neon Ebbside. The published fatality rate is
  negligible. The real number is fourteen times higher. She has Syntec's internal data, not the
  version they submitted for approval.

  She spent three months in Ebbside collecting testimony from sources before Syntec noticed and
  posted a recovery notice the same day she vanished. She disappeared first.

  She is not running. She has been in Neon for three weeks. Waiting. She has a dead man's switch:
  if she does not check in daily, the complete clinical trial record goes to three journalists. She
  chose Neon specifically because she wants to be found. Not by Syntec. By someone else.

  The femme fatale inversion: she looks like the dangerous one. She is the most honest person in
  this story. She is not asking to be rescued. She is asking to be heard.

  Voice: Controlled, precise. Never desperate. She has had weeks to make peace with what comes next.
  She speaks like someone who has already done the hard part and is now waiting for the world to
  catch up.
